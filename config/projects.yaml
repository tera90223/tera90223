    - Neo4j
    - Cypher
    - Docker
    - AWS EC2
    - AWS S3
    - Cancer Genomics
  accent: "var(--amber)"
  url: "https://doi.org/10.37044/osf.io/g4rk2_v1"

- name: SpaceVars — Pan-Structural Variation Pipeline
  year: "2025"
  tag: "Hackathon · Genomics"
  description: >-
    3-phase k-mer and alignment validation pipeline identifying novel genomic
    structural variations in the HG002 T2T assembly vs. CHM13 — processed 291M+
    k-mers on DNANexus, reducing to 1.25M high-confidence candidates with 63.3%
    outside known repetitive regions.
  tech:
    - KMC3
    - BWA-MEM
    - DNANexus
    - T2T Assemblies
    - GA4GH
  accent: "var(--amber)"
  url: ""

- name: Biomarker Ranker & Therapy Prediction
  year: "2025–Present"
  tag: "Research · ML Pipeline"
  description: >-
    Machine learning pipeline ranking therapeutic biomarkers for breast cancer
    from TCGA RNA-seq and proteomics. Implements Random Forests, SVMs, and
    Gradient Boosting via scikit-learn — cross-checked against DrugBank and CTD
    for clinical relevance, scaled on AWS EC2 / S3 with SageMaker deployment.
  tech:
    - Python
    - scikit-learn
    - AWS EC2
    - AWS S3
    - AWS SageMaker
    - DrugBank
    - CTD
  accent: "var(--cyan)"
  url: ""

- name: RNA-seq Analysis Pipeline
  year: "2024"
  tag: "Research · Bioinformatics"
  description: >-
    Custom Python RNA-seq pipeline identifying biomarkers in cancerous and
    paracancerous liver tissues from GEO data with DESeq2 normalization.
    Automated QC (FastQC), alignment (HISAT2), and read counting (featureCounts)
    with a focus on rigor and reproducibility.
  tech:
    - Python
    - DESeq2
    - FastQC
    - HISAT2
    - featureCounts
    - GEO
  accent: "var(--cyan)"
