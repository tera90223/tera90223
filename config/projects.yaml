- name: GeNETwork — Cancer Knowledge Graph
  year: "2025"
  tag: "Hackathon · Knowledge Graphs"
  description: >-
    Neo4j knowledge graph integrating somatic variant, drug, and clinical
    evidence across 6 databases (TCGA, MTP, OncoDB, CIVIC, MSigDB, HGNC) — with
    a melanoma case study linking oncogene-induced senescence genes to
    druggable targets. Piloted on AWS EC2 with data on S3.
