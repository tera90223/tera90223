paragraphs:
  - >-
    I'm a bioinformatician focused on translating genomic data into actionable
    biology. My work spans cancer genomics, federated learning across biobanks,
    and knowledge graphs for therapeutic discovery — with hackathon-driven
    publications in BioHackrXiv and an in-prep submission to F1000Research.
  - >-
    I'm comfortable across the stack: building RNA-seq pipelines in Python,
    deploying Neo4j knowledge graphs on AWS, and applying classical ML and
    federated frameworks like NVIDIA FLARE. I care about reproducible,
    collaborative science that works across institutions.
