- type: work
  title: Project Lead Contributor & Co-Author — Team RAIDers
  org: Carnegie Mellon & NVIDIA Federated Learning Hackathon
  location: Pittsburgh, PA
  period: Jan 2026
  bullets:
    - >-
      Integrated multi-source ALS genomic data (ClinVar — ~450 pathogenic
      variants across 34 genes, gnomAD, ALSod, GeneCards, OMIM) into a federated
      learning framework using NVIDIA FLARE.
    - >-
      Demonstrated federated feasibility by maintaining analytical fidelity
      across distributed institutional nodes, enabling subtype discovery across
      diverse ancestries without centralizing sensitive data.
    - >-
      Applied federated ML to map ALS genetic variants to biological pathways,
      identifying distinct molecular subtypes to support precision therapeutic
      stratification.
    - >-
      Presented findings to Dr. Ahmad Al Khleifat (Head of ALS Research, King's
      College London), resulting in expressed interest in formal research
      collaboration.
    - >-
      Co-authored resulting preprint: [Mu, J. et al. (2026). Towards Federated
      Learning Across Biobanks. BioHackrXiv.](https://doi.org/10.37044/osf.io/5psfj_v1)

- type: work
  title: Participant & Co-Author — Team GeNETwork
  org: AWS Open Data & NVIDIA Knowledge Graph Hackathon
  location: Arlington, VA
  period: Nov 2025
  bullets:
    - >-
      Delivered one of the only functional knowledge graphs at the hackathon,
      integrating somatic variant, drug, and clinical evidence across 6
      databases (TCGA, MTP, OncoDB, CIVIC, MSigDB, HGNC) to identify therapeutic
      opportunities in cancer.
    - >-
      Built a Neo4j graph database in Docker, piloting deployment on AWS EC2
      with genomic datasets stored on AWS S3 — 6 node types and Cypher queries
      enabling flexible pathway-centric retrieval and downstream analytics.
    - >-
      Demonstrated clinical utility through a melanoma use case, linking
      oncogene-induced senescence pathway genes to druggable targets and
      identifying drug repurposing and combination therapy candidates.
    - >-
      Collaborated with EMBL-EBI team in London on cross-institutional graph
      analysis, showcasing reproducibility across research environments.
    - >-
      Co-authored resulting preprint in [BioHackrXiv](https://doi.org/10.37044/osf.io/g4rk2_v1).

- type: work
  title: Participant & Co-Author — Team SpaceVars
  org: Baylor College of Medicine Pan-Structural Variation Hackathon
  location: Houston, TX
  period: Aug 2025
  bullets:
    - >-
      Contributed as scientific writer and analyst for SpaceVars, a 3-phase
      k-mer and alignment validation pipeline to identify novel genomic
      structural variations in the HG002 T2T assembly relative to the CHM13
      reference genome.
    - >-
      Processed and analyzed over 291M HG002-specific k-mers on DNANexus,
      reducing 1,254,647 high-confidence novel sequence candidates (0.43% of
      input) through multi-phase filtering using KMC3 and BWA-MEM.
    - >-
      Demonstrated that 63.3% of final candidate sequences fall outside known
      repetitive regions, supporting genuine genomic novelty rather than
      alignment artifacts.
    - >-
      Documented findings and interpreted results for team publication,
      currently in preparation for submission to F1000Research Hackathons
      channel.

